<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRON CROSS | Class Display</title><style>:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff}header{padding:24px 4vw;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand-logo{display:block;width:clamp(230px,38vw,560px);height:auto;max-height:110px;object-fit:contain;object-position:left center}h1{font-size:clamp(25px,3vw,48px);letter-spacing:.13em;margin:0}small,.muted{color:#aaa}.container{padding:3vw 4vw}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.clock{color:#fff;transition:color .2s ease}.clock.warning{color:#ffd600}.clock.urgent{color:#ff3030}.clock{font-size:clamp(75px,12vw,190px);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:1}.phase{font-size:clamp(26px,3vw,52px);font-weight:800}.sub{font-size:clamp(18px,2vw,30px);color:#bbb;margin-top:8px}.bar{display:flex;gap:8px;margin:28px 0}.segment{height:10px;background:#444;flex:var(--f);border-radius:10px}.segment.active{background:#fff}.exercises{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:25px}.exercise{border:2px solid #3a3a3a;padding:22px;border-radius:12px;min-height:125px}.exercise h2{margin:0 0 12px;font-size:clamp(21px,2.4vw,38px)}.superset{border:1px solid #555;border-radius:14px;padding:14px;background:#101010}.superset-title{font-size:clamp(19px,2vw,29px);font-weight:800;letter-spacing:.09em;margin:2px 0 12px;color:#f15a29}.superset .exercise{margin-bottom:10px}.superset .exercise:last-child{margin-bottom:0}.superset .exercise h2{font-size:clamp(21px,2.2vw,36px)}.volume-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.volume-pair .exercise{margin-bottom:0}@media(max-width:650px){.volume-pair{grid-template-columns:1fr}}.alternative{margin-top:16px;padding-top:13px;border-top:1px solid #444;color:#f0f0f0;font-size:clamp(17px,1.65vw,26px);line-height:1.4}.alternative strong{color:#f15a29;font-size:.72em;letter-spacing:.09em;display:block;margin-bottom:5px}.exercise p{margin:0;font-size:clamp(18px,1.8vw,27px);color:#bbb}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}button,input,select,textarea{font:inherit}button{background:#fff;color:#000;border:0;border-radius:8px;padding:14px 20px;font-weight:bold;cursor:pointer}button.secondary{background:#2d2d2d;color:#fff}button:disabled{opacity:.4}details{border-top:1px solid #333;padding:20px 0}summary{cursor:pointer;font-weight:bold;font-size:19px}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field textarea{background:#161616;color:white;border:1px solid #555;border-radius:6px;padding:10px;width:100%}.field textarea{min-height:115px}.note{color:#aaa;font-size:14px;line-height:1.5}#editPanel{display:none}body.editor.coach #editPanel{display:block}body.tv #loginPanel,body.tv header .mode,body.tv .controls,body.tv details,body.tv .note,body.tv #editToggle{display:none}body.tv .container{padding-top:5vw}body.tv .exercise{min-height:170px}body.tv .exercise h2{font-size:clamp(26px,3vw,52px)}@media(max-width:650px){.exercises,.editor{grid-template-columns:1fr}.clock{color:#fff;transition:color .2s ease}.clock.warning{color:#ffd600}.clock.urgent{color:#ff3030}.clock{font-size:76px}.exercise{min-height:95px}header{padding:18px}.brand-logo{display:block;width:clamp(230px,38vw,560px);height:auto;max-height:110px;object-fit:contain;object-position:left center}h1{font-size:24px}}#loginPanel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 4vw;border-bottom:1px solid #333}#loginPanel input{background:#161616;color:white;border:1px solid #555;border-radius:6px;padding:10px;max-width:230px}#status{font-size:14px;color:#ccc}body.tv #loginPanel{display:none}body:not(.coach) #editToggle,body:not(.coach) .controls,body:not(.coach) #editPanel{display:none}body:not(.coach) #tvMode{display:inline-block}@media(max-width:650px){#loginPanel{align-items:stretch}#loginPanel input{max-width:100%}}</style></head><body><header><div><img class="brand-logo" src="iron-cross-logo.png" alt="Iron Cross Fitness Coaching"><small>CLASS WORKOUT</small></div><div class="mode"><button class="secondary" id="tvMode">TV View</button> <button class="secondary" id="editToggle">Edit Workout</button></div></header><div id="loginPanel"><span id="status">Connecting to Supabase…</span><input id="email" type="email" placeholder="Coach email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="login">Coach Sign In</button><button id="logout" class="secondary" style="display:none">Sign Out</button></div><main class="container"><div class="top"><div><div class="phase" id="phaseName">MOBILITY</div><div class="sub" id="workoutName">Full Body · Sample Session</div></div><div class="clock" id="clock">10:00</div></div><div class="bar" id="bar"></div><div class="sub" id="phaseInfo">Phase 1 of 4 · All exercises displayed</div><section class="exercises" id="exercises"></section><div class="controls"><button id="start">Start</button><button class="secondary" id="reset">Reset Phase</button><button class="secondary" id="nextPhase">Next Phase »</button></div><p class="note">Cloud-synced class dashboard. Coach signs in to save workouts and control the timer. TVs can view without signing in. Each new phase waits for Start.</p><details id="editPanel"><summary>Program your workout</summary><div class="editor"><div class="field"><label>Workout name</label><input id="nameInput"></div><div class="field"><label>Workout date / focus</label><input id="focusInput"></div><div class="field"><label>Mobility — one exercise per line (use | for sets/reps)</label><textarea id="mobilityInput"></textarea></div><div class="field"><label>Strength — four lines: Compound 1, Compound 2, Volume Superset 3a, 3b (Exercise | sets/reps)</label><textarea id="strengthInput"></textarea></div><div class="field"><label>Endurance — Main exercise | reps/time || Alternative exercise | reps/time</label><textarea id="enduranceInput"></textarea></div><div class="field"><label>Recovery — one exercise per line (use | for duration)</label><textarea id="recoveryInput"></textarea></div></div><div class="controls"><button id="save">Save Workout</button><button class="secondary" id="sample">Restore Sample</button></div></details></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
// Set these two public values from Supabase → Project Settings → Data API / API Keys.
// NEVER put a service_role or secret key in this file.
const SUPABASE_URL = 'https://ixonnyawdnnxijakaqtf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_CFfbycN_TZ31-C9Gs6cRHQ_LSwHK7Kf';
const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_');
const db = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY) : null;
const defaults={name:'Full Body',focus:'Sample Session',phases:[['MOBILITY',600,['Cat-Cow | 60 sec','World’s Greatest Stretch | 6 / side','Glute Bridge | 2 × 12','Bodyweight Squat | 2 × 10']],['STRENGTH',1200,['Barbell Back Squat | 3 × 8','Dumbbell Bench Press | 3 × 10','Dumbbell Row | 3 × 10 / side','Reverse Lunge | 3 × 8 / leg']],['ENDURANCE',600,['Ski Erg | 45 sec || Battle Ropes | 45 sec','Kettlebell Swing | 15 reps || Dumbbell Romanian Deadlift | 15 reps','Bike | 45 sec || Fast Step-Ups | 45 sec','Plank | 45 sec || Dead Bug | 12 / side']],['RECOVERY',300,['Box Breathing | 2 min','Hip Flexor Stretch | 60 sec / side','Forward Fold | 60 sec']]]};let workout=structuredClone(defaults),phase=0,remaining=600,running=false,endsAt=null;
let workoutId=null,sessionId=null,coach=false,lastStateStamp='',lastWorkoutStamp='',busy=false;
const $=id=>document.getElementById(id);function render(){let p=workout.phases[phase];$('phaseName').textContent=p[0];$('workoutName').textContent=workout.name+' · '+workout.focus;$('clock').classList.toggle('warning',remaining>30&&remaining<=60);$('clock').classList.toggle('urgent',remaining<=30);$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('phaseInfo').textContent='Phase '+(phase+1)+' of 4 · '+(running?'Timer running':remaining===0?'Phase complete · Press Next Phase':'Ready · Press Start');$('bar').innerHTML=workout.phases.map((x,i)=>'<div class="segment '+(i===phase?'active':'')+'" style="--f:'+x[1]+'"></div>').join('');const exerciseCard=(x,label)=>{let parts=phase===2?x.split('||'):[x],a=parts[0].split('|'),alt=parts[1]?parts[1].split('|'):null;return '<article class="exercise"><h2>'+esc(label)+'. '+esc(a[0].trim())+'</h2><p>'+esc(a.slice(1).join('|').trim())+'</p>'+(alt?'<div class="alternative"><strong>ALTERNATIVE</strong>'+esc(alt[0].trim())+(alt.length>1?' · '+esc(alt.slice(1).join('|').trim()):'')+'</div>':'')+'</article>'};$('exercises').innerHTML=phase===1?'<div class="superset"><div class="superset-title">COMPOUND 1</div>'+(p[2][0]?exerciseCard(p[2][0],'1'):'')+'</div><div class="superset"><div class="superset-title">COMPOUND 2</div>'+(p[2][1]?exerciseCard(p[2][1],'2'):'')+'</div><div class="superset" style="grid-column:1/-1"><div class="superset-title">VOLUME SUPERSET</div><div class="volume-pair">'+[2,3].map((i)=>p[2][i]?exerciseCard(p[2][i],i===2?'3a':'3b'):'').join('')+'</div></div>'+p[2].slice(4).map((x,i)=>exerciseCard(x,String(i+5))).join(''):p[2].map((x,i)=>exerciseCard(x,String(i+1))).join('');$('start').textContent=running?'Pause':'Start';$('start').disabled=!coach||busy;$('reset').disabled=!coach||busy;$('nextPhase').disabled=!coach||busy;}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function currentRemaining(){return running&&endsAt?Math.max(0,Math.ceil((new Date(endsAt).getTime()-Date.now())/1000)):remaining}
function status(t){$('status').textContent=t}
function setCoach(enabled){coach=enabled;document.body.classList.toggle('coach',enabled);$('email').style.display=enabled?'none':'';$('password').style.display=enabled?'none':'';$('login').style.display=enabled?'none':'';$('logout').style.display=enabled?'':'none';status(enabled?'Coach connected · Live cloud sync':'TV / viewer mode · Live cloud sync');render()}
async function loadCloud(){if(!db)return;
 try{
 const w=await db.from('workouts').select('*').order('updated_at',{ascending:false}).limit(1);
 if(w.error)throw w.error;
 if(w.data.length){const row=w.data[0];workoutId=row.id;if(row.updated_at!==lastWorkoutStamp){const d=row.workout_data;if(d&&Array.isArray(d.phases)&&d.phases.length===4){workout=d;workout.phases[1][1]=1200;lastWorkoutStamp=row.updated_at;if(document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT')populate()}}}
 const q=await db.from('class_sessions').select('*').order('updated_at',{ascending:false}).limit(1);
 if(q.error)throw q.error;
 if(q.data.length){const row=q.data[0];sessionId=row.id;if(row.updated_at!==lastStateStamp){lastStateStamp=row.updated_at;phase=Math.max(0,Math.min(3,row.phase_index));remaining=row.remaining_seconds;running=row.is_running;endsAt=row.ends_at}}
 render();
 }catch(e){status('Sync error: '+e.message)}
}
async function writeSession(changes){if(!coach||busy)return;busy=true;
 try{const row={phase_index:phase,remaining_seconds:remaining,is_running:running,ends_at:endsAt,workout_id:workoutId,updated_at:new Date().toISOString(),...changes};
 let res=sessionId?await db.from('class_sessions').update(row).eq('id',sessionId).select().single():await db.from('class_sessions').insert(row).select().single();
 if(res.error)throw res.error;sessionId=res.data.id;lastStateStamp=res.data.updated_at;phase=res.data.phase_index;remaining=res.data.remaining_seconds;running=res.data.is_running;endsAt=res.data.ends_at;render();
 }catch(e){alert('Could not update timer: '+e.message);await loadCloud()}finally{busy=false}}
async function changePhase(n){if(!coach)return;phase=Math.max(0,Math.min(3,n));remaining=workout.phases[phase][1];running=false;endsAt=null;render();await writeSession({})}
$('start').onclick=async()=>{if(!coach||busy)return;const r=currentRemaining();if(r===0)return;remaining=r;running=!running;endsAt=running?new Date(Date.now()+remaining*1000).toISOString():null;render();await writeSession({})};
$('nextPhase').onclick=()=>{if(phase<3)changePhase(phase+1)};
$('reset').onclick=()=>{changePhase(phase)};
setInterval(()=>{const r=currentRemaining();if(r!==remaining){remaining=r;render()}if(r===0&&running){running=false;endsAt=null;render();if(coach&&!busy){if(phase<3)changePhase(phase+1);else writeSession({is_running:false,remaining_seconds:0,ends_at:null})}}},250);
$('tvMode').onclick=()=>{document.body.classList.toggle('tv');$('tvMode').textContent=document.body.classList.contains('tv')?'Exit TV View':'TV View'};
$('editToggle').onclick=()=>{if(!coach){alert('Sign in as coach to edit workouts.');return}document.body.classList.toggle('editor')};
function populate(){$('nameInput').value=workout.name;$('focusInput').value=workout.focus;['mobility','strength','endurance','recovery'].forEach((id,i)=>$(id+'Input').value=workout.phases[i][2].join('\n'))}
async function save(){if(!coach)return;const next=structuredClone(workout);next.name=$('nameInput').value.trim()||'Class Workout';next.focus=$('focusInput').value.trim();['mobility','strength','endurance','recovery'].forEach((id,i)=>{next.phases[i][2]=$(id+'Input').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12)});
 try{const res=workoutId?await db.from('workouts').update({name:next.name,workout_data:next,updated_at:new Date().toISOString()}).eq('id',workoutId).select().single():await db.from('workouts').insert({name:next.name,workout_data:next}).select().single();if(res.error)throw res.error;workout=next;workoutId=res.data.id;lastWorkoutStamp=res.data.updated_at;await changePhase(0);alert('Workout saved online. Both TVs will update shortly.')}catch(e){alert('Could not save workout: '+e.message)}}
$('save').onclick=save;$('sample').onclick=()=>{workout=structuredClone(defaults);populate();save()};
$('login').onclick=async()=>{if(!db)return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){alert('Enter your coaching email and password.');return}status('Signing in…');const {error}=await db.auth.signInWithPassword({email,password});$('password').value='';if(error){status('Sign-in failed: '+error.message);return}setCoach(true);await loadCloud();await ensureInitialRows()};
$('logout').onclick=async()=>{await db.auth.signOut();setCoach(false);document.body.classList.remove('editor')};
async function ensureInitialRows(){if(!coach||!db)return;try{if(!workoutId){const r=await db.from('workouts').insert({name:workout.name,workout_data:workout}).select().single();if(r.error)throw r.error;workoutId=r.data.id;lastWorkoutStamp=r.data.updated_at}if(!sessionId){await writeSession({phase_index:0,remaining_seconds:600,is_running:false,ends_at:null})}}catch(e){status('Setup error: '+e.message)}}
async function init(){populate();render();if(!db){status('Setup required: add your Supabase Project URL and publishable key to index.html');return}const {data:{session}}=await db.auth.getSession();setCoach(!!session);await loadCloud();if(session)await ensureInitialRows();setInterval(loadCloud,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadCloud()});db.auth.onAuthStateChange((_event,s)=>setCoach(!!s))}
init();</script></body></html>
